<!--
    Modal usado pelo intérprete para registrar (ou reabrir) uma dúvida
    sobre o ponto atualmente em inspeção (TKT-000011). Acionado por
    openDoubtModal() em controllers/temporal.js.
-->
<div class="modal-header">
    <h3 class="modal-title">
        <span class="glyphicon glyphicon-question-sign"></span>
        {{ 'DOUBT.REGISTER_TITLE' | i18n }}
    </h3>
    <button type="button" class="close" ng-click="cancel()" aria-label="{{ 'COMMON.CLOSE' | i18n }}">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <p style="margin-bottom: 12px;">
        {{ 'DOUBT.POINT' | i18n }}: <b>{{ pointId }}</b>
        <span ng-if="campaignId"> &mdash; {{ 'CAMPAIGN.CAMPAIGN' | i18n }}: <b>{{ campaignId }}</b></span>
    </p>

    <div class="form-group">
        <label for="doubtText">{{ 'DOUBT.DESCRIBE' | i18n }} <small class="text-muted">({{ 'DOUBT.LENGTH_HINT' | i18n }})</small></label>
        <textarea id="doubtText"
                  class="form-control"
                  rows="5"
                  maxlength="2000"
                  ng-model="form.text"
                  placeholder="{{ 'DOUBT.TEXT_PLACEHOLDER' | i18n }}"></textarea>
        <div class="help-block" style="margin-top: 4px;">
            {{ (form.text || '').length }} / 2000
        </div>
    </div>

    <div class="form-group" ng-if="years && years.length > 0">
        <label for="doubtYear">{{ 'DOUBT.REFERENCE_YEAR' | i18n }} <small class="text-muted">({{ 'DOUBT.OPTIONAL' | i18n }})</small></label>
        <select id="doubtYear" class="form-control" ng-model="form.year">
            <option value="">&mdash; {{ 'DOUBT.NONE' | i18n }} &mdash;</option>
            <option ng-repeat="y in years" value="{{ y }}">{{ y }}</option>
        </select>
    </div>

    <div class="alert alert-danger" ng-if="errorMessage">
        {{ errorMessage }}
        <div ng-if="errorDetail"><small>{{ errorDetail }}</small></div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="cancel()" ng-disabled="submitting">
        {{ 'COMMON.CANCEL' | i18n }}
    </button>
    <button type="button" class="btn btn-warning" ng-click="submit()"
            ng-disabled="submitting || !form.text || form.text.trim().length < 5">
        <span class="glyphicon glyphicon-send"></span>
        {{ 'DOUBT.SEND' | i18n }}
    </button>
</div>
